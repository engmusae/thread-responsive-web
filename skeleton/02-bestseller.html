<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Bestseller</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- 개별 CSS 파일 연결 -->
    <link rel="stylesheet" href="02-bestseller.css" />
  </head>
  <body>
    <section class="bestseller-section">
      <div class="row align-items-center">
        <div class="col-lg-3 mb-4 mb-lg-0">
          <h2 class="bestseller-title">베스트셀러</h2>
        </div>

        <div class="col-lg-9">
          <div id="bestsellerCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
              
              <!-- 첫 번째 슬라이드 (도서 1~4) -->
              <div class="carousel-item active" data-bs-interval="4000">
                <div class="row text-center justify-content-center">
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img1.jpeg" alt="도서1" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img2.jpeg" alt="도서2" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img3.jpeg" alt="도서3" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img4.jpeg" alt="도서4" class="bestseller-img img-fluid" />
                  </div>
                </div>
              </div>

              <!-- 두 번째 슬라이드 (도서 5~8) -->
              <div class="carousel-item" data-bs-interval="4000">
                <div class="row text-center justify-content-center">
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img5.jpeg" alt="도서5" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img6.jpeg" alt="도서6" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img7.jpeg" alt="도서7" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img8.jpeg" alt="도서8" class="bestseller-img img-fluid" />
                  </div>
                </div>
              </div>

              <!-- 세 번째 슬라이드 (도서 9~12) -->
              <div class="carousel-item" data-bs-interval="4000">
                <div class="row text-center justify-content-center">
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img9.jpeg" alt="도서9" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img10.jpeg" alt="도서10" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img11.jpeg" alt="도서11" class="bestseller-img img-fluid" />
                  </div>
                  <div class="col-6 col-md-3 mb-3">
                    <img src="assets/bestsellers/img12.jpeg" alt="도서12" class="bestseller-img img-fluid" />
                  </div>
                </div>
              </div>

            </div>

            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#bestsellerCarousel"
              data-bs-slide="next"
            >
              <span class="carousel-control-next-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
