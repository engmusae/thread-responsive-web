<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Genre</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="04-genre_list.css" />
  </head>
  <body>
    <section class="genre-books py-5" aria-labelledby="genre-books-title">
      <h2 id="genre-books-title" class="genre-section-title mb-4">장르별 도서 목록</h2>

      <div class="genre-grid">
        <article class="genre-item">
          <img src="assets/genre/art.jpg" alt="예술 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">예술</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/baby.jpg" alt="유아 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">유아</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/economy.jpg" alt="경제 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">경제</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/health.jpg" alt="건강 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">건강</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/history.jpg" alt="역사 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">역사</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/natural_science.jpg" alt="자연과학 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">자연과학</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/philosophy.jpg" alt="철학 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">철학</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/romance.jpg" alt="로맨스 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">로맨스</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/travel.jpg" alt="여행 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">여행</h3>
        </article>
        <article class="genre-item">
          <img src="assets/genre/youth.jpg" alt="청소년 장르 대표 이미지" class="genre-image" />
          <h3 class="genre-name">청소년</h3>
        </article>
      </div>
    </section>
  </body>
</html>
