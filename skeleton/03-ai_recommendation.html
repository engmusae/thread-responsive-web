<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - AI recommendation</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="03-ai_recommendation.css" />
  </head>
  <body>
    <section class="ai-recommendation py-5" aria-labelledby="ai-recommendation-title">
      <div class="row align-items-center g-4">
        <!-- 좌측: 추천 도서 3권 (12칸 중 7칸) -->
        <div class="col-12 col-md-7">
          <div class="recommendation-books">
            <img
              src="assets/ai_recommendation/img1.jpeg"
              alt="Bauhaus 도서 표지"
              class="recommendation-book"
            />
            <img
              src="assets/ai_recommendation/img2.jpeg"
              alt="Mastering AI 도서 표지"
              class="recommendation-book recommendation-book--featured"
            />
            <img
              src="assets/ai_recommendation/img3.jpeg"
              alt="Design 도서 표지"
              class="recommendation-book"
            />
          </div>
        </div>

        <!-- 우측: 서비스 소개 (12칸 중 5칸) -->
        <div class="col-12 col-md-5">
          <h2 id="ai-recommendation-title" class="recommendation-title mb-3">
            AI 추천
          </h2>
          <p class="text-muted mb-2">
            구매 목록, 감명 깊게 읽은 도서 등
          </p>
          <p class="text-muted mb-0">
            사용자
            <span class="recommendation-highlight">활동 데이터 기반</span>
            인공지능 도서 추천
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
